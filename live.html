<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solving - youtube signature</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --line: #1e2634; --text: #dbe3f0;
    --dim: #7b8aa3; --ok: #2ecc71; --bad: #e5484d; --warn: #f5a524;
    --accent: #4c9aff; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; font-family: var(--mono); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  .card-h { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px;
            text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }

  /* --- status head --- */
  .head { display: flex; align-items: center; gap: 14px; padding: 18px; }
  .spinner { width: 34px; height: 34px; flex: 0 0 34px; position: relative; }
  .spinner div {
    position: absolute; inset: 0; border: 3px solid transparent; border-radius: 50%;
    border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  .spinner div:nth-child(2) { inset: 5px; border-top-color: #7c5cff; animation-duration: 1.3s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin-off .spinner div { animation: none; opacity: .25; }
  .head-txt { flex: 1; min-width: 0; }
  #stage { font-size: 15px; font-weight: 600; }
  #detail { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* --- progress steps --- */
  .steps { display: flex; gap: 0; padding: 0 18px 16px; flex-wrap: wrap; }
  .step { flex: 1 1 0; min-width: 92px; position: relative; padding-top: 20px; font-size: 11px;
          color: var(--dim); text-align: center; font-family: var(--mono); }
  .step::before { content: ""; position: absolute; top: 6px; left: 50%; width: 9px; height: 9px;
                  margin-left: -4.5px; border-radius: 50%; background: var(--line); border: 1px solid #2a3444; }
  .step::after { content: ""; position: absolute; top: 10px; left: 50%; width: 100%; height: 1px; background: var(--line); }
  .step:last-child::after { display: none; }
  .step.active { color: var(--accent); }
  .step.active::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(76,154,255,.16); }
  .step.done { color: var(--ok); }
  .step.done::before { background: var(--ok); border-color: var(--ok); }

  /* --- stats --- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); }
  .stat { background: var(--panel); padding: 12px 14px; }
  .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }

  /* --- log --- */
  #log { max-height: 260px; overflow-y: auto; padding: 8px 0; font-family: var(--mono); font-size: 12px; }
  .row { display: grid; grid-template-columns: 62px 1fr 74px 52px; gap: 10px;
         padding: 3px 14px; align-items: center; }
  .row:hover { background: #161c28; }
  .row .t { color: #4a5772; text-align: right; }
  .row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { text-align: right; font-weight: 700; }
  .row .tm { text-align: right; color: #4a5772; }
  .s206 { color: var(--ok); } .s403 { color: var(--bad); } .soth { color: var(--warn); }
  .pending { color: var(--dim); }
  .win { background: rgba(46,204,113,.09); }

  /* --- video --- */
  .vid { padding: 14px; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; }
  .hidden { display: none !important; }

  /* --- link box --- */
  .linkbox { padding: 12px 14px; font-family: var(--mono); font-size: 11px; color: var(--dim);
             word-break: break-all; line-height: 1.55; }
  .linkbox a { color: var(--accent); }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px;
           font-family: var(--mono); font-weight: 700; }
  .b-ok { background: rgba(46,204,113,.14); color: var(--ok); }
  .b-bad { background: rgba(229,72,77,.14); color: var(--bad); }
  .b-warn { background: rgba(245,165,36,.14); color: var(--warn); }
  .err { padding: 14px; color: var(--bad); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>YouTube signature solver</h1>
  <div class="sub" id="sub">connecting...</div>

  <div class="card">
    <div class="head" id="head">
      <div class="spinner"><div></div><div></div></div>
      <div class="head-txt">
        <div id="stage">starting</div>
        <div id="detail">opening solver stream</div>
      </div>
      <div id="clock">0.0s</div>
    </div>
    <div class="steps">
      <div class="step" data-s="read">read</div>
      <div class="step" data-s="load">load player</div>
      <div class="step" data-s="plan">plan</div>
      <div class="step" data-s="search">test</div>
      <div class="step" data-s="verify">206</div>
      <div class="step" data-s="play">play</div>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="k-probes">0</b><span>probes</span></div>
      <div class="stat"><b id="k-206" class="s206">0</b><span>passed 206</span></div>
      <div class="stat"><b id="k-403" class="s403">0</b><span>rejected 403</span></div>
      <div class="stat"><b id="k-time">0.0s</b><span>elapsed</span></div>
    </div>
  </div>

  <div class="card" id="logcard">
    <div class="card-h">candidate tests &mdash; live</div>
    <div id="log"></div>
  </div>

  <div class="card hidden" id="playcard">
    <div class="card-h">player</div>
    <div class="vid"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="linkbox" id="linkbox"></div>
  </div>

  <div class="card" id="expcard">
    <div class="card-h">what the solver has learned &mdash; from every past run</div>
    <div id="exp" class="linkbox">loading...</div>
  </div>

  <div class="card hidden" id="errcard"><div class="err" id="errmsg"></div></div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stageLabels = {
    read: 'reading cipher',
    load: 'loading player',
    plan: 'planning candidates',
    search: 'testing candidates',
    verify: 'verified 206',
    play: 'playing',
  };
  const STAGES = ['read', 'load', 'plan', 'search', 'verify', 'play'];
  let current = -1;
  let counts = { probes: 0, ok: 0, bad: 0 };
  let t0 = null;
  function started() { if (t0 !== null) return; t0 = Date.now(); tick(); }
  let clockTimer = null;
  const rows = new Map();

  function setStage(s, detail) {
    const i = STAGES.indexOf(s);
    if (i >= 0 && i > current) current = i;
    for (const el of document.querySelectorAll('.step')) {
      const si = STAGES.indexOf(el.dataset.s);
      el.classList.toggle('active', si === current);
      el.classList.toggle('done', si < current);
    }
    if (stageLabels[s]) $('stage').textContent = stageLabels[s];
    if (detail) $('detail').textContent = detail;
  }

  function tick() {
    const ms = t0 === null ? 0 : Date.now() - t0;
    $('clock').textContent = (ms / 1000).toFixed(1) + 's';
    $('k-time').textContent = (ms / 1000).toFixed(1) + 's';
  }
  clockTimer = setInterval(tick, 100);

  function bumpProbe() {
    counts.probes++;
    $('k-probes').textContent = counts.probes;
  }

  function addRow(key, data) {
    let row = rows.get(key);
    if (!row) {
      row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="t"></span><span class="lbl"></span>'
                    + '<span class="st pending">testing</span><span class="tm"></span>';
      row.querySelector('.lbl').textContent = data.label + (data.n ? '  +  ' + data.n : '');
      row.querySelector('.t').textContent = data.t == null ? '' : (data.t / 1000).toFixed(2) + 's';
      if (data.tier === 0) row.querySelector('.lbl').textContent += '   (saved recipe)';
      $('log').appendChild(row);
      rows.set(key, row);
      $('log').scrollTop = $('log').scrollHeight;
    }
    return row;
  }

  function finishRow(row, status, ms) {
    const st = row.querySelector('.st');
    const isOk = status === 206 || status === 200;
    st.className = 'st ' + (isOk ? 's206' : status === 403 ? 's403' : 'soth');
    st.textContent = isOk ? '206 OK' : String(status);
    row.querySelector('.tm').textContent = ms == null ? '' : (ms / 1000).toFixed(2) + 's';
    if (isOk) { row.classList.add('win'); counts.ok++; } else { counts.bad++; }
    $('k-206').textContent = counts.ok;
    $('k-403').textContent = counts.bad;
  }

  function openStream() {
    const es = new EventSource('/api/solve');
    es.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      handle(es, m);
    };
    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) {
        $('detail').textContent = 'stream closed';
      }
    };
  }

  function handle(es, m) {
    started();
    switch (m.type) {
      case 'stage':
        setStage(m.stage, m.message);
        if (m.stage === 'search') setStage('search', 'testing candidates against googlevideo');
        break;

      case 'cipher':
        $('sub').textContent = 'itag ' + (m.itag || '?') + '  |  s ' + m.sLen + ' chars  |  host '
                             + (m.host || '?') + (m.expire ? '  |  expires ' + new Date(m.expire * 1000).toLocaleTimeString() : '');
        break;

      case 'build':
        setStage('load', m.file + '  (' + (m.bytes / 1048576).toFixed(2) + ' MB)');
        break;

      case 'plan':
        setStage('plan', m.candidates.length + ' sig candidates x ' + m.nCandidates + ' n candidates');
        break;

      case 'probe':
        // A probe is starting: open a row for it, keyed by the same pair the
        // result will carry.
        bumpProbe();
        addRow(m.probes + ':' + m.label + ':' + (m.n || ''), m);
        setStage('search', 'probe ' + m.probes + '  -  ' + m.label + (m.n ? '  +  ' + m.n : ''));
        break;

      case 'probe-result': {
        const row = rows.get(m.probes + ':' + m.label + ':' + (m.n || ''));
        if (row) finishRow(row, m.status, m.t);
        break;
      }

      case 'solved':
        setStage('verify', m.source);
        break;

      case 'done':
        loadExperience();
        clearInterval(clockTimer);
        document.getElementById('head').classList.add('spin-off');
        break;

      case 'failed':
        // Every candidate was tried and YouTube rejected all of them. Say so
        // plainly - the spinner must stop, never hang.
        clearInterval(clockTimer);
        document.getElementById('head').classList.add('spin-off');
        $('errcard').classList.remove('hidden');
        $('errmsg').innerHTML = '<b>Tried ' + m.probes + ' candidate(s) - all rejected (403).</b><br>'
          + 'That means the transform we read from the player is not the one this URL needs - '
          + 'usually an old cipher or a player that changed shape. '
          + 'Re-run to fetch a fresh cipher, or drop a new base.js into this folder.';
        setStage('search', 'all ' + m.probes + ' candidates rejected');
        break;

      case 'error':
        $('errcard').classList.remove('hidden');
        $('errmsg').textContent = m.message;
        setStage('search', 'failed: ' + m.message);
        break;
    }
  }

  // Separate lightweight poll for the final link + build the player.
  async function finish() {
    try {
      const r = await fetch('/api/link', { cache: 'no-store' });
      const j = await r.json();
      if (j.error) return;
      $('playcard').classList.remove('hidden');
      const v = $('v');
      // Play through the local proxy: it does the Range requests and keeps
      // the signed URL off the browser's CORS path. The direct link stays
      // available in the box below.
      v.src = j.stream || '/stream';
      v.play().catch(() => {});
      setStage('play', 'itag ' + j.itag);
      document.querySelectorAll('.step').forEach((el) => el.classList.add('done'));
      $('linkbox').innerHTML =
        '<span class="badge b-ok">206</span> solved link<br><a href="' + j.url + '" target="_blank" rel="noreferrer">'
        + j.url + '</a><br><br>sig: ' + (j.solvedSig || '') + '<br>n: '
        + (j.solvedN || '') + ' &nbsp;<span style="color:#4a5772">(raw ' + (j.rawN || '') + ')</span>';
    } catch (e) { /* page may be closing */ }
  }

  // Show the accumulated track record: this is what makes later runs faster.
  async function loadExperience() {
    try {
      const r = await fetch('/api/experience', { cache: 'no-store' });
      const j = await r.json();
      const rows = (j.candidates || []).slice(0, 6);
      if (!rows.length) { $('exp').textContent = 'nothing learned yet - this run will teach it'; return; }
      $('exp').innerHTML = rows.map((c) => {
        const pct = Math.round(c.winRate * 100);
        const cls = c.wins ? 's206' : 's403';
        return '<div>' + c.label.replace(/</g, '&lt;') + ' &nbsp; <span class="' + cls + '">'
          + 'won ' + c.wins + '/' + c.tries + ' (' + pct + '%)</span>'
          + ' &nbsp; <span style="color:#4a5772">avg ' + c.avgProbes.toFixed(1) + ' probe(s)</span></div>';
      }).join('') + '<div style="margin-top:8px">'
        + j.wins + ' wins / ' + j.losses + ' losses remembered</div>';
    } catch (e) { $('exp').textContent = 'unavailable'; }
  }

  // Start
  loadExperience();
  setStage('read', 'opening solver stream');
  $('sub').textContent = 'cipher.txt';
  openStream();

  // When the stream ends, load the link.
  const origHandle = handle;
  handle = function (es, m) {
    origHandle(es, m);
    if (m.type === 'done' || m.type === 'error') { es.close(); finish(); }
  };
})();
</script>
</body>
</html>
